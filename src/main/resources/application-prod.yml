# application-prod.yml
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eduspace:
  jwt:
    secret-key: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000
    password-reset-token-expiration: 300000

  app:
    frontend-url: https://eduspace.com
    backend-url: ${BACKEND_URL}

  google:
    client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    root: WARN