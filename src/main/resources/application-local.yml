spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

eduspace:
  jwt:
    secret-key: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000
    password-reset-token-expiration: 300000

  app:
    frontend-url: ${FRONTEND_URL}
    backend-url: ${BACKEND_URL}

logging:
  level:
    root: INFO
    com.sanket.eduspace: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

file:
  upload:
    directory: uploads
    max-size: 10MB